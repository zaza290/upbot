<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBot AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <header class="chat-header">
            <div class="bot-icon">🤖</div>

            <div>
                <h1>StudyBot AI</h1>
                <p>AI Study Assistant</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>


        <!-- Chat Messages -->
        <main id="chat-box" class="chat-box">

            <div class="message bot-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="message-content">
                    <span class="sender">StudyBot</span>

                    <div class="bubble">
                        Hello! 👋 I'm StudyBot, your AI study assistant.
                        <br><br>
                        Ask me a question and I'll try my best to help you.
                    </div>
                </div>

            </div>

        </main>


        <!-- Input Area -->
        <form id="chat-form" class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Ask StudyBot something..."
                autocomplete="off"
                required
            >

            <button type="submit" id="send-button">
                Send
            </button>

        </form>

    </div>


    <script>

        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chatBox = document.getElementById("chat-box");
        const sendButton = document.getElementById("send-button");


    function addMessage(sender, text, type) {

            const messageDiv = document.createElement("div");

            if (type === "user") {
                messageDiv.className = "message user-message";

                messageDiv.innerHTML = `
                    <div class="message-content user-content">
                        <span class="sender">You</span>

                        <div class="bubble">
                            ${escapeHTML(text)}
                        </div>
                    </div>

                    <div class="avatar user-avatar">
                        👤
                    </div>
                `;

            } else {

                messageDiv.className = "message bot-message";

                messageDiv.innerHTML = `
                    <div class="avatar">
                        🤖
                    </div>

                    <div class="message-content">
                        <span class="sender">StudyBot</span>

                        <div class="bubble">
                            ${escapeHTML(text)}
                        </div>
                    </div>
                `;
            }

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        function showLoading() {

            const loading = document.createElement("div");

            loading.id = "loading-message";
            loading.className = "message bot-message";

            loading.innerHTML = `
                <div class="avatar">
                    🤖
                </div>

                <div class="message-content">
                    <span class="sender">StudyBot</span>

                    <div class="bubble loading">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            chatBox.appendChild(loading);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function removeLoading() {

            const loading = document.getElementById("loading-message");

            if (loading) {
                loading.remove();
            }
        }


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = input.value.trim();

            if (!message) {
                return;
            }


            // Display user's message
            addMessage("You", message, "user");


            // Clear input
            input.value = "";


            // Disable input while AI is responding
            input.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = "Thinking...";


            showLoading();


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();


                removeLoading();


                if (response.ok) {

                    addMessage(
                        "StudyBot",
                        data.answer,
                        "bot"
                    );

                } else {

                    addMessage(
                        "StudyBot",
                        "Error: " + (data.error || "Something went wrong."),
                        "bot"
                    );
                }


            } catch (error) {

                removeLoading();

                addMessage(
                    "StudyBot",
                    "Unable to connect to the Flask server.",
                    "bot"
                );

                console.error(error);

            }


            // Enable input again
            input.disabled = false;
            sendButton.disabled = false;
            sendButton.textContent = "Send";

            input.focus();

        });

    </script>

</body>
</html>
